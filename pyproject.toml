[project]
name = "swingtrading"
version = "0.1.0"
description = "End-of-day swing trading signals and tracking"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pandas-market-calendars>=5.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "yfinance==1.7.0",
]

[project.scripts]
swing = "swingtrading.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swingtrading"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# pandas_market_calendars still calls Series.dt.weekday; harmless, and noisy in every test.
filterwarnings = ["ignore:Series.dt.weekday is deprecated"]
